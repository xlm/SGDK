name: C++ builds

on:
  push:
    branches: [cpp]
  pull_request:
    branches: [cpp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build C++ games
        uses: ./.github/actions/cpp-build
